name: Deploy game to GitHub Pages

# Manual trigger ONLY — deploying publishes the site (and the included era tiles) publicly.
# See PLAN.md §5 license caution: the heightfield is reversible into prices. Choose eras deliberately.
on:
  workflow_dispatch:
    inputs:
      eras:
        description: "Comma-separated era tile sets to include (others pruned from the build)"
        required: false
        default: "recent2y,synthetic"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install and test
        working-directory: game
        run: |
          npm ci
          npx vitest run
      - name: Build
        working-directory: game
        run: npm run build
      - name: Prune era tiles not selected for public release
        working-directory: game/dist/tiles
        run: |
          KEEP="${{ github.event.inputs.eras || 'recent2y,synthetic' }}"
          for d in */; do
            era="${d%/}"
            case ",$KEEP," in
              *",$era,"*) echo "keeping $era" ;;
              *) echo "pruning $era"; rm -rf "$d" ;;
            esac
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
